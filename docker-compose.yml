services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: sec_loom
      POSTGRES_USER: sec_loom
      POSTGRES_PASSWORD: sec_loom
    ports:
      - "5433:5432"
    volumes:
      - sec_loom_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sec_loom -d sec_loom"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  sec_loom_postgres:
