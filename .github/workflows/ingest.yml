name: SEC ingestion

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: Ingestion command
        required: true
        default: sync
        type: choice
        options:
          - sync
          - bootstrap

concurrency:
  group: sec-loom-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'sec-loom-raw' }}
      OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
      SEC_MAX_REQUESTS_PER_SECOND: "8"
      INGEST_CONCURRENCY: "4"
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Apply migrations
        run: npm run db:migrate
      - name: Run selected ingestion
        run: npm run ingest:${{ github.event.inputs.command || 'sync' }}
